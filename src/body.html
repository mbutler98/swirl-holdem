<canvas id="bg" aria-hidden="true"></canvas>
<div id="crt" aria-hidden="true"></div>

<div id="app">
  <!-- HOME = SETUP -->
  <section id="home" class="screen">
    <div class="logo-cards" id="logoCards" aria-hidden="true"></div>
    <h1 class="logo" aria-label="Dead Rabbit"><span class="l1" data-word="DEAD RABBIT"></span><img class="rabbit" src="RABBIT_SRC" alt=""></h1>
    <div class="modeswitch" role="tablist" aria-label="Game mode">
      <button role="tab" id="modeQuick" aria-selected="true">Quick play</button>
      <button role="tab" id="modeCamp" aria-selected="false">Campaign</button>
    </div>

    <div class="panel setup-panel" id="quickPanel">
      <div class="field"><h3>Opponents</h3><div class="seg n5" id="segOpp" role="group" aria-label="Number of opponents"></div></div>
      <div class="field"><h3>Table</h3><div class="seg n2" id="segDiff" role="group" aria-label="Opponent skill"></div></div>
      <div class="toglist" id="quickToggles"></div>
    </div>

    <div class="panel setup-panel" id="campPanel" hidden>
      <div class="antenav">
        <button class="arrow" id="antePrev" aria-label="Previous ante">&lt;</button>
        <div class="antetitle"><b id="anteName"></b><span id="anteSub"></span></div>
        <button class="arrow" id="anteNext" aria-label="Next ante">&gt;</button>
      </div>
      <div class="blindcards" id="blindCards"></div>
      <p class="blindinfo" id="blindInfo"></p>
      <div class="toglist" id="campToggles"></div>
    </div>

    <div class="homeactions">
      <button class="btn b-gold big" id="primaryBtn">Deal me in</button>
      <button class="btn b-violet hasbadge" id="collectionBtn">Collection</button>
    </div>
  </section>

  <!-- COLLECTION -->
  <section id="collection" class="screen" hidden>
    <div class="colbox panel">
      <div class="colhead">
        <button class="arrow" id="colPrev" aria-label="Previous page">&lt;</button>
        <div class="coltitle"><b id="colTitle">Booster packs</b><span id="colDots"></span></div>
        <button class="arrow" id="colNext" aria-label="Next page">&gt;</button>
      </div>
      <div class="colpage" id="colPage"></div>
      <div class="colcaption" id="colCaption"></div>
      <button class="btn b-gold" id="colBack">Back</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <div class="topbar">
      <div class="flag" id="flag" aria-hidden="true"></div>
      <span id="handNo" hidden></span><span id="blinds" hidden></span>
      <span class="grow"></span>
      <button class="iconbtn" id="cheatBtn" aria-label="Cheat sheets">?</button>
      <button class="iconbtn" id="menuBtn">Options</button>
    </div>
    <div id="bossbar" class="panel" hidden></div>
    <div id="opps"></div>
    <div id="center">
      <div class="potrow">
        <div id="deck" aria-hidden="true"></div>
        <div id="pot"><i class="chipico"></i><span class="lbl">Pot</span><span id="potNum" data-v="0">$0</span></div>
      </div>
      <div id="board"></div>
      <div id="status" aria-live="polite"></div>
    </div>
    <div id="hero">
      <div class="herobet"><span class="betchip" id="heroBet" hidden></span></div>
      <div id="heroCards"><div class="slot"></div><div class="slot"></div></div>
      <div class="heroinfo">
        <span class="chip dchip" id="heroD" hidden>D</span>
        <span class="chip blindchip" id="heroBlind" hidden></span>
        <span class="chip">You <span id="heroChips" data-v="1000">$1000</span></span>
        <span class="chip" id="heroLabel" hidden></span>
      </div>
    </div>
    <div id="hud" class="panel" hidden></div>
    <div id="coach" class="panel" hidden></div>
    <div id="raiseTray" class="panel" hidden>
      <div class="presets" id="presets"></div>
      <input type="range" id="raiseRange" min="0" max="100" step="5" aria-label="Raise amount">
      <div class="raiseRow">
        <button class="btn b-grey" id="raiseCancel" style="flex:0 0 32%">Back</button>
        <button class="btn b-gold" id="raiseGo">Raise</button>
      </div>
    </div>
    <div id="actions"></div>
  </section>
</div>

<div id="fx"><canvas id="parts"></canvas></div>
<div id="scrim" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="grab"></div>
  <div class="sheethead"><h2 id="sheetTitle">Cheat sheets</h2><button class="btn b-grey closebtn" id="sheetClose">Close</button></div>
  <div class="sheetBody" id="sheetBody"></div>
</div>
<div id="modal" class="panel" hidden></div>
<img id="rabbitSrc" src="RABBIT_SRC" alt="" hidden><img id="chipSrc" src="CHIP_SRC" alt="" hidden>
